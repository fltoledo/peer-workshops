summary:
  en: How do faster release cycles, observability and synthetic monitoring change performance testing practices that were designed for slower releases? The first WOPR held in Latin America, in English.
  es: ¿Cómo cambian los ciclos de entrega más rápidos, la observabilidad y el monitoreo sintético las prácticas de pruebas de performance pensadas para releases más lentos? El primer WOPR realizado en Latinoamérica, en inglés.
  pt: Como ciclos de entrega mais rápidos, observabilidade e monitoramento sintético mudam as práticas de testes de performance pensadas para releases mais lentos? O primeiro WOPR realizado na América Latina, em inglês.
